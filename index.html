<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFF9F5">
    <title>Braille Quest</title>
    <meta name="description" content="Aprende Braille de forma interactiva con actividades educativas">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f45925",
                        "background-light": "#f8f6f5",
                        "background-dark": "#221410",
                        "text-main": "#1c110d",
                        "text-sub": "#9c5e49",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header" id="main-header">
            <button class="icon-btn" id="menu-btn" aria-label="Menú">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="app-title">Braille Quest</h1>
            <div class="avatar" id="user-avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23FFE4D6'/%3E%3Ccircle cx='20' cy='16' r='8' fill='%23FF6B35'/%3E%3Cpath d='M8 36c0-8 5.4-12 12-12s12 4 12 12' fill='%23FF6B35'/%3E%3C/svg%3E"
                    alt="Avatar">
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-content" id="main-content">
            <!-- Screens will be injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-item active" data-screen="home">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Inicio</span>
            </button>
            <button class="nav-item" data-screen="dictionary">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Diccionario</span>
            </button>
            <button class="nav-item" data-screen="stats">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Estadísticas</span>
            </button>
            <button class="nav-item" data-screen="settings">
                <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                    <path
                        d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Ajustes</span>
            </button>
        </nav>

        <!-- Activity Overlay (for lessons) -->
        <div class="activity-overlay hidden" id="activity-overlay">
            <!-- Activity content injected here -->
        </div>

        <!-- Modal Container -->
        <div class="modal-overlay hidden" id="modal-overlay">
            <div class="modal" id="modal-content">
                <!-- Modal content injected here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/braille-data.js"></script>
    <script src="data/levels.js"></script>
    <script src="utils/state.js"></script>
    <script src="utils/hints.js"></script>
    <script src="utils/haptics.js"></script>
    <script src="components/braille-cell.js"></script>
    <script src="components/navigation.js"></script>
    <script src="components/modal.js"></script>
    <script src="components/cards.js"></script>
    <script src="screens/home.js"></script>
    <script src="screens/learning-path.js"></script>
    <script src="screens/settings.js"></script>
    <script src="screens/dictionary.js"></script>
    <script src="screens/stats.js"></script>
    <script src="activities/observe.js"></script>
    <script src="activities/build.js"></script>
    <script src="activities/pick.js"></script>
    <script src="activities/words.js"></script>
    <script src="activities/games.js"></script>
    <script src="app.js"></script>
</body>

</html>
